name: Playwright Python Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 2 * * *'  # Daily at 2 AM UTC

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
        browser: [chromium, firefox, webkit]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Install Playwright browsers
        run: playwright install ${{ matrix.browser }} --with-deps
      
      - name: Run tests
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          HEADLESS: true
          BROWSER: ${{ matrix.browser }}
        run: |
          pytest tests/ -v \
            --html=test-results/report.html \
            --self-contained-html \
            --junitxml=test-results/junit.xml \
            -m "not ui or browser == '${{ matrix.browser }}'" \
            -n auto
      
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.python-version }}-${{ matrix.browser }}
          path: test-results/
          retention-days: 7
      
      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ matrix.python-version }}-${{ matrix.browser }}
          path: test-results/screenshots/
          retention-days: 7
      
      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: traces-${{ matrix.python-version }}-${{ matrix.browser }}
          path: test-results/traces/
          retention-days: 7

  docker-test:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Build Docker image
        run: |
          cd docker
          docker build -t playwright-python-tests:latest ..
      
      - name: Run Docker tests
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
        run: |
          cd docker
          docker-compose up --abort-on-container-exit
      
      - name: Upload Docker test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-test-results
          path: docker/../test-results/
          retention-days: 7